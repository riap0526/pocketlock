name: Release

# Builds the signed APK and publishes it as a GitHub Release (PocketLock-<version>.apk).
#
# Start it from the Actions tab (Release -> Run workflow) with a build number, e.g. 15 for
# v1.4-fork.15, or push a tag like v1.4-fork.15. Use a number at least as high as any build
# already installed (e.g. the CI run that was tested), otherwise Android refuses the update as a
# downgrade. Release notes are taken from .github/release-notes/<tag>.md when that file exists.
on:
  workflow_dispatch:
    inputs:
      build:
        description: "Build number (e.g. 15 for v1.4-fork.15)"
        required: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Version
        env:
          BUILD_INPUT: ${{ github.event.inputs.build }}
        run: |
          BASE=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -1)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if ! [[ "$BUILD_INPUT" =~ ^[0-9]+$ ]]; then echo "Build number must be a number"; exit 1; fi
            NUM="$BUILD_INPUT"
          else
            if ! [[ "$GITHUB_REF_NAME" =~ ^v([0-9.]+)-fork\.([0-9]+)$ ]]; then
              echo "Tag must look like v1.4-fork.15"; exit 1
            fi
            if [ "${BASH_REMATCH[1]}" != "$BASE" ]; then
              echo "Tag version ${BASH_REMATCH[1]} does not match versionName $BASE"; exit 1
            fi
            NUM="${BASH_REMATCH[2]}"
          fi
          echo "FORK_BUILD_NUMBER=$NUM" >> "$GITHUB_ENV"
          echo "VERSION=$BASE-fork.$NUM" >> "$GITHUB_ENV"
          echo "TAG=v$BASE-fork.$NUM" >> "$GITHUB_ENV"

      - name: Prepare signing
        env:
          PASS: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          if [ -z "$PASS" ] || [ ! -f signing/release.jks.enc ]; then
            echo "Release builds must be signed: KEYSTORE_PASSPHRASE or signing/release.jks.enc missing."
            exit 1
          fi
          mkdir -p keystore
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in signing/release.jks.enc -out keystore/release.jks -pass env:PASS
          printf 'storeFile=keystore/release.jks\nstorePassword=%s\nkeyAlias=pocketlock\nkeyPassword=%s\n' \
            "$PASS" "$PASS" > keystore.properties

      - name: Build signed release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "PocketLock-$VERSION.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=".github/release-notes/$TAG.md"
          if [ ! -f "$NOTES" ]; then
            NOTES="$RUNNER_TEMP/notes.md"
            echo "See [CHANGELOG.md](CHANGELOG.md)." > "$NOTES"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$NOTES"
            gh release upload "$TAG" "PocketLock-$VERSION.apk" --clobber
          else
            gh release create "$TAG" "PocketLock-$VERSION.apk" --target "$GITHUB_SHA" \
              --title "Pocket Lock $VERSION" --notes-file "$NOTES" --latest
          fi
